<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- amoeba's icon.

       1024 square with the squircle inset 100px on every side, which is the
       macOS grid: an icon drawn edge to edge sits proudly larger than every
       other icon in the dock.

       The blob is generated rather than drawn by hand — a radius function with
       four pseudopods and four dents, smoothed through its samples with a
       Catmull-Rom pass so the tangents agree at every join. Hand-placed
       control points read as a flower.

       Two colours and no more: the window's own base and its accent. The
       accent is spent on one thing here for the same reason it is in the
       window — a second hue would make neither one the subject. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24273a"/>
      <stop offset="1" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f5a97f"/>
      <stop offset="1" stop-color="#ee99a0"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#ground)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="none"
        stroke="#494d64" stroke-width="3" stroke-opacity="0.7"/>

